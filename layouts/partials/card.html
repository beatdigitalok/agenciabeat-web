{{ $p := . }}
<article class="card">
  {{ with $p.Params.imagen }}<a href="{{ $p.Permalink }}"><img src="{{ . }}" loading="lazy" alt=""></a>{{ end }}
  <span class="cat">{{ range first 1 ($p.GetTerms "secciones") }}{{ .Title }}{{ end }}</span>
  <h3><a href="{{ $p.Permalink }}">{{ $p.Title }}</a></h3>
</article>
